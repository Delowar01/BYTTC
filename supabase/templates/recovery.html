<h2>Reset your password</h2>
<p>We received a request to reset the password for your staff account.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Set a new password</a></p>
<p>This link expires in one hour and can be used once. If you did not request a reset, ignore this email — your password will not change.</p>
